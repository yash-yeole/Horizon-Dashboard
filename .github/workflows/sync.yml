name: Sync Frontend and Backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial for git subtree to work properly

      # 1. Sync Frontend Space
      - name: Push Frontend to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree push --prefix=energy-dashboard https://YashYeole:$HF_TOKEN@huggingface.co/spaces/YashYeole/dashboard_frontend main --force

      # 2. Sync Backend Space
      - name: Push Backend to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree push --prefix=backend https://YashYeole:$HF_TOKEN@huggingface.co/spaces/YashYeole/horizon_backend main --force
