name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

# Each HF Space is a Docker Space whose ROOT must hold its own Dockerfile + README
# frontmatter, but ours live in subfolders. We mirror each subfolder to its Space
# root with huggingface_hub's upload_folder (delete_patterns="*" clears stale files
# first). The target namespace + Space names are resolved from the token itself
# (case-insensitive match) so a username-casing mismatch can't 404 us again.
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install huggingface_hub
        run: python3 -m pip install --upgrade "huggingface_hub>=0.25"

      - name: Deploy subfolders to their HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          who = api.whoami()
          user = who["name"]
          print("Authenticated as:", user, "| type:", who.get("type"))
          spaces = [s.id for s in api.list_spaces(author=user)]
          print("Spaces under this account:", spaces)

          def resolve(suffix: str) -> str:
              for s in spaces:
                  if s.split("/")[-1].lower() == suffix.lower():
                      return s
              return f"{user}/{suffix}"  # fall back to a create-on-push target

          for folder, suffix in [("backend", "horizon-backend"),
                                 ("energy-dashboard", "horizon-frontend")]:
              repo_id = resolve(suffix)
              print(f"Deploying {folder}/ -> {repo_id} ...", flush=True)
              api.upload_folder(
                  repo_id=repo_id, repo_type="space", folder_path=folder,
                  delete_patterns="*", commit_message="Deploy from GitHub Action",
              )
              print(f"  {repo_id} synced", flush=True)
          PY
