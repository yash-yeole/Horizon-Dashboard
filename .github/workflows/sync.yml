name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual runs from the Actions tab

# Each HF Space is a Docker Space whose ROOT must hold its own Dockerfile + README
# frontmatter, but ours live in subfolders. We mirror each subfolder to its Space
# root with huggingface_hub's upload_folder (delete_patterns="*" clears stale files).
# NB the exact Space ids: backend is horizon_backend (UNDERSCORE), frontend is
# horizon-frontend (hyphen). HF shows both as hyphens in the *.hf.space subdomain,
# which is what caused the earlier 404s.
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install huggingface_hub
        run: python3 -m pip install --upgrade "huggingface_hub>=0.25"

      - name: Deploy subfolders to their HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          print("Authenticated as:", api.whoami().get("name"), flush=True)
          targets = [
              ("backend", "YashYeole/horizon_backend"),        # underscore
              ("energy-dashboard", "YashYeole/horizon-frontend"),  # hyphen
          ]
          for folder, repo_id in targets:
              print(f"Deploying {folder}/ -> {repo_id} ...", flush=True)
              api.upload_folder(
                  repo_id=repo_id, repo_type="space", folder_path=folder,
                  delete_patterns="*", commit_message="Deploy from GitHub Action",
              )
              print(f"  {repo_id} synced", flush=True)
          PY
