name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]

jobs:
  sync-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: YashYeole/horizon-frontend
          hf_token: ${{ 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 }}

  sync-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: YashYeole/horizon-backend
          hf_token: ${{ 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 }}
