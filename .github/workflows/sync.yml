name: Sync to Hugging Face Spaces
on:
  push:
    branches: [main]

# Each HF Space is a Docker Space whose ROOT must hold its own Dockerfile +
# README frontmatter. Our repo keeps them in subfolders (backend/, energy-dashboard/),
# so we push each subfolder as the Space root via `git subtree split` + force-push
# (a whole-repo push would put the Dockerfiles one level too deep and fail to build).
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions"

      - name: Push backend/ -> horizon-backend Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree split --prefix=backend -b hf-backend
          git push --force "https://YashYeole:$HF_TOKEN@huggingface.co/spaces/YashYeole/horizon-backend" hf-backend:main
          git branch -D hf-backend

      - name: Push energy-dashboard/ -> horizon-frontend Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git subtree split --prefix=energy-dashboard -b hf-frontend
          git push --force "https://YashYeole:$HF_TOKEN@huggingface.co/spaces/YashYeole/horizon-frontend" hf-frontend:main
          git branch -D hf-frontend
